<!doctype html>
<html lang="pr-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Avaliativo</title>
</head>

<body>
    <main>
        <section id="profile" aria-labelledby="profile-title">
            <h2 id="profile-title">Seu perfil</h2>

            <form id="form-profile" novalidate>
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required />
                    <span class="error" id="error-name" role="alert"></span>
                </div>

                <div class="campo">
                    <label for="area">Área de interesse</label>
                    <input type="text" id="area" name="area" required />
                    <span class="error" id="error-area" role="alert"></span>
                </div>

                <div class="campo">
                    <label for="habilidades">Habilidades</label>
                    <input type="text" id="skills" name="skills" required
                    placeholder="Ex: JavaScript, HTML, CSS" />
                    <span class="error" id="error-skills" role="alert"></span>
                </div>

                <div class="campo">
                    <label for="experiencia">Tempo de experiência (em meses)</label>
                    <input type="number" id="experience" name="experience" min="0" required />
                    <span class="error" id="error-experience" role="alert"></span>
                </div>

                <button type="submit">Analisar a compatibilidade</button>
            </form>
        </section>
    </main>

    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
